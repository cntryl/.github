name: Feature proposal
description: Propose a change grounded in a concrete use case
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the need before proposing an implementation. For substantial work, wait for maintainer agreement before starting.
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: Describe the use case, current limitation, and desired outcome with a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If you have an approach in mind, describe it along with alternatives or compatibility concerns.
  - type: textarea
    id: assistance
    attributes:
      label: Tool assistance
      description: Write "None" or briefly identify material AI or generative-tool assistance and how you reviewed its output.
    validations:
      required: true
