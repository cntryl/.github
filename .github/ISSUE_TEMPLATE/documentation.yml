name: Documentation correction
description: Report incorrect, unclear, incomplete, or outdated documentation
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Link the page or identify the exact file and section.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should change?
      description: Explain the problem, what you needed from the documentation, and the correction you suggest.
    validations:
      required: true
  - type: textarea
    id: assistance
    attributes:
      label: Tool assistance
      description: Write "None" or briefly identify material AI or generative-tool assistance and how you reviewed its output.
    validations:
      required: true
