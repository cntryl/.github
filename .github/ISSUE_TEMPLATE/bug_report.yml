name: Bug report
description: Report a problem affecting a cntryl project
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include secrets or private information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you did, what happened, and what you expected instead. Include exact errors when useful.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest sequence or example that reproduces the problem. If it is intermittent, describe when it occurs.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, operating system, provider, configuration, or commit SHA.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add logs, measurements, screenshots, or links that help explain the problem.
  - type: textarea
    id: assistance
    attributes:
      label: Tool assistance
      description: Write "None" or briefly identify material AI or generative-tool assistance and how you reviewed its output.
    validations:
      required: true
